# Лекція 1: визначники та СЛАР (Крамер, Гаус).
# 10 питань по 0,5 бала кожне -> усього 5 балів (points_per_question нормує
# питання незалежно від кількості полів усередині).
- key: lecture1
  title: "Лекція 1. Визначники та системи лінійних рівнянь"
  question_count: 10
  points_per_question: 0.5
  bank:
    - det_2x2                            # визначник 2×2
    - det_3x3_sarrus                     # визначник 3×3 (Саррюс)
    - det_triangular                     # визначник трикутної матриці
    - determinant_property               # властивості визначника
    - det_scalar_multiple                # властивість: Δ(cA) = c^n·Δ
    - matrix_scalar_element              # елемент kA
    - matrix_sum_element                 # елемент A+B
    - matrix_transpose_element           # елемент транспонованої
    - matrix_linear_combination_element  # елемент aA+bB
    - linear_system_2x2                  # Крамер 2×2 (Δ -> x -> y)
    - cramer_3x3                         # Крамер 3×3, ЧАСТКОВО (Δ + одна невідома)
  max_attempts: 2
  max_reissues: 2

# Лекція 2: рівняння прямої на площині та в просторі.
# 10 питань по 0,5 бала -> усього 5. У банку 11 шаблонів (беремо 10), один із
# них — з рисунком (line_from_graph), тож він трапляється приблизно 1 з 10.
- key: lecture2
  title: "Лекція 2. Рівняння прямої на площині та в просторі"
  question_count: 10
  points_per_question: 0.5
  bank:
    - general_line_C                     # загальне рівняння: знайти C
    - slope_intercept_from_general       # загальне -> y = kx + b
    - line_intercepts                    # відрізки на осях
    - distance_point_to_line             # відстань від точки до прямої
    - point_substitution                 # підстановка точки в рівняння
    - direction_vector_2pts              # напрямний вектор (площина)
    - space_direction_vector             # напрямний вектор (простір)
    - dot_product_3d                     # скалярний добуток
    - perpendicular_parallel_slope       # k паралельної / перпендикулярної
    - line_through_two_points            # пряма через дві точки (k, b, y0)
    - line_from_graph                    # РИСУНОК: зчитати y = kx + b з графіка
  max_attempts: 2
  max_reissues: 2

# Тема (шкільна математика): числова функція та її властивості.
# 12 питань по 1 балу -> усього 12. У банку 13 шаблонів (беремо 12), два з них
# з рисунками (graph_vertex, graph_zeros), тож 1-2 графічні питання на тест.
# Рівно 12 РІЗНИХ типів завдань, і беремо всі 12 -> у кожній спробі всі питання
# різнотипні (жодних повторів типу), лише числа й порядок індивідуальні.
- key: theme1
  title: "Числова функція: область визначення, значень, властивості"
  question_count: 12
  points_per_question: 1
  bank:
    - domain_fraction        # D дробу: виключені точки
    - domain_sqrt            # D кореня: ліва межа
    - domain_sqrt_strict     # D дробу з коренем у знаменнику: строга межа
    - value_solve            # при яких x f(x) = m
    - function_zeros         # нулі квадратичної функції
    - zeros_linear           # нуль лінійної функції
    - parity_compute         # f(-x) як вираз (парність) [клавіатура + прев'ю]
    - parity_values          # f(a), f(-a) для дослідження парності
    - symmetry_point         # симетрія точки (геом. зміст парності)
    - parabola_vertex_x      # абсциса вершини (зміна монотонності)
    - graph_vertex           # РИСУНОК: вершина параболи з графіка
    - graph_zeros            # РИСУНОК: нулі функції з графіка
  max_attempts: 2
  max_reissues: 2

# Лекція 3: криві другого порядку (коло, еліпс, гіпербола, парабола).
# 12 різних типів, беруться всі 12 (без повторів типу). Два з рисунками
# (коло й еліпс на координатній площині).
- key: lecture3
  title: "Лекція 3. Криві другого порядку"
  question_count: 12
  points_per_question: 1
  bank:
    - circle_from_canonical       # коло: центр і радіус із канонічного рівняння
    - circle_from_general         # коло: повні квадрати -> центр і радіус
    - circle_radius_through_point # коло: радіус через точку (відстань)
    - ellipse_semi_axes_focus     # еліпс: півосі a, b і фокус c
    - ellipse_eccentricity        # еліпс: ексцентриситет c/a
    - distance_foci               # відстань між фокусами 2c
    - hyperbola_semi_axes_focus   # гіпербола: a, b, c
    - hyperbola_asymptote         # гіпербола: нахил асимптоти b/a
    - parabola_param_focus        # парабола: p, фокус, директриса
    - curve_center_general        # загальне рівняння -> центр кривої
    - circle_from_graph           # РИСУНОК: коло -> центр і радіус
    - ellipse_from_graph          # РИСУНОК: еліпс -> півосі
  max_attempts: 2
  max_reissues: 2

# Тема (шкільна математика, заняття 5): степенева функція та корінь n-го степеня.
# 12 різних типів (без перетворень графіків — цього ще не вивчали). Винесення
# множника дає вираз, тож задіяні клавіатура з коренем і живий прев'ю.
- key: theme2
  title: "Степенева функція. Корінь n-го степеня та його властивості"
  question_count: 12
  points_per_question: 1
  # Якісний тест на РОЗУМІННЯ теми (не одноактові обчислення): властивості
  # степеневої функції, парність символьно й через властивість, обернена дія;
  # спрощення виразів з буквами, властивість з модулем. 6 степеневих + 6 коренів.
  bank:
    # --- степенева функція та її властивості ---
    - power_value             # значення y = x^n у точці (базове)
    - negative_power_value    # значення y = x^(-n) = 1/x^n (цілий від'ємний показник)
    - power_parity_symbolic   # знайти f(-x) як вираз -> парність (розуміння)
    - power_parity_apply      # застосувати парність: f(a) відоме -> f(-a)
    - power_solve_odd         # x^n = c, непарний n (один корінь)
    - power_solve_even        # x^(2k) = c, парний степінь (два корені ±)
    # --- корінь n-го степеня та властивості ---
    - root_value              # корінь n-го степеня (різні степені, базове)
    - odd_root_negative       # непарний корінь з від'ємного (парн./непарн. кореня)
    - root_expression         # значення виразу з кількох коренів (багатокрокова)
    - even_root_modulus       # властивість з модулем: 2k√(a^2k) = |a|
    - root_simplify           # винесення множника k√m (вираз, клавіатура)
    - root_simplify_var       # спрощення кореня з буквами n√(x^..y^..) (розуміння)
  max_attempts: 2
  max_reissues: 2

# Тест 1 (11 клас): первісна та невизначений інтеграл.
# 12 різних типів, беруться всі 12 (без повторів типу). Майже всі відповіді —
# ВИРАЗ первісної F(x) (kind="expr"), тож задіяні клавіатура і живий прев'ю.
# Повне покриття програми: таблиця первісних (степенева, 1/x², 1/√x, sin, cos,
# eˣ, 1/cos²x, 1/sin²x), правила (сума, множник, f(kx+b)), визначення сталої C
# за точкою, обернений зв'язок F'=f, фізичний зміст (первісна швидкості).
- key: integral1
  title: "Первісна та невизначений інтеграл (11 клас)"
  question_count: 12
  points_per_question: 1
  bank:
    # --- степенева / многочлени ---
    - antideriv_poly_point       # первісна квадратного тричлена через точку
    - antideriv_expand           # спершу розкрити дужки, тоді первісна
    - antideriv_cubic_value      # первісна кубічної через точку -> F(x1) (число)
    # --- таблиця первісних (дробові) ---
    - antideriv_reciprocal_sq    # 1/x² -> −1/x
    - antideriv_sqrt             # 1/√x -> 2√x
    # --- правило для f(kx+b) ---
    - antideriv_linear_power     # (kx+b)ⁿ
    - antideriv_trig_linear      # a·sin(kx) / a·cos(kx)
    - antideriv_exp_linear       # a·e^{kx}
    - antideriv_trig_table       # 1/cos²x -> tg x ; 1/sin²x -> −ctg x
    # --- зв'язок F'=f, стала C, фізичний зміст ---
    - antideriv_find_f           # за первісною F знайти f = F'
    - antideriv_find_constant    # знайти сталу C за точкою (число)
    - antideriv_kinematics       # v(t) -> закон руху s(t)
  max_attempts: 2
  max_reissues: 2

# Тест 2 (11 клас): визначений інтеграл і його застосування до обчислення площ.
# 12 різних типів (усі 12 беруться). Чотири задачі на площу — з рисунком
# (заштрихована фігура). Покриття: Ньютон–Лейбніц (многочлен, тригонометрія,
# 1/√x, 1/x², за даною первісною), властивості (лінійність), обернена задача
# (знайти межу), площі (криволінійна трапеція; парабола й вісь; парабола й пряма;
# фігура під віссю = |інтеграл|), фізика (шлях = інтеграл швидкості).
- key: integral2
  title: "Визначений інтеграл та обчислення площ фігур (11 клас)"
  question_count: 12
  points_per_question: 1
  bank:
    # --- формула Ньютона–Лейбніца ---
    - def_nl_poly            # інтеграл многочлена
    - def_nl_trig            # інтеграл sin/cos (межі з π)
    - def_nl_sqrt            # інтеграл a/√x
    - def_nl_reciprocal      # інтеграл k/x²
    - def_nl_from_F          # за первісною F: F(b)-F(a)
    # --- властивості та обернена задача ---
    - def_property_linear    # лінійність: ∫(αf-βg)
    - def_find_limit         # знайти верхню межу b
    # --- площі фігур (з рисунком) ---
    - area_trapezoid         # РИСУНОК: криволінійна трапеція під прямою
    - area_parabola_axis     # РИСУНОК: парабола (вниз) і вісь Ox
    - area_parabola_line     # РИСУНОК: парабола y=x² і пряма
    - area_below_axis        # РИСУНОК: фігура під віссю, S = |інтеграл|
    # --- фізичне застосування ---
    - def_displacement       # шлях = ∫ v(t) dt
  max_attempts: 2
  max_reissues: 2

# ТЕМАТИЧНЕ ОЦІНЮВАННЯ: інтеграл (уся тема) — 12 задач по 1 балу.
# Відмінність від integral1/integral2: задачі КОМПЛЕКСНІ — перевіряється ШЛЯХ
# розв'язання (2–4 поля на задачу: первісна -> стала -> значення; межі перетину ->
# площа; нулі -> інтеграл -> площа). Часткові бали всередині задачі нормуються
# (3 кроки з 4 = 0.75), а перенесення помилки (carry) звіряє наступні кроки з
# власним результатом студента. Три задачі на площу — з рисунком.
# Фізичну формулу наведено в умові (тему в класі ще не давали).
- key: integral_thematic
  title: "Тематичне оцінювання: інтеграл (первісна, невизначений і визначений)"
  question_count: 12
  points_per_question: 1
  bank:
    # --- первісна та невизначений інтеграл ---
    - th_antideriv_poly_point   # F0 -> стала C -> F(x1)
    - th_antideriv_table_sum    # сума двох табличних (a/√x + b/x²) -> C
    - th_antideriv_rules        # правило f(kx+b): sin/e^ або cos/1cos²x -> C
    - th_antideriv_inverse      # означення навпаки: за F знайти f -> f(x0)
    # --- визначений інтеграл ---
    - th_definite_nl            # Ньютон–Лейбніц: F0 -> F0(n) -> інтеграл
    - th_definite_trig          # тригонометричний з межами через π
    - th_definite_properties    # адитивність + лінійність (без обчислень)
    - th_definite_find_limit    # обернена: знайти межу b (квадратне рівняння)
    # --- площі (РИСУНОК) ---
    - th_area_trapezoid         # криволінійна трапеція (геометричний зміст)
    - th_area_between           # перетини як межі -> площа між кривими
    - th_area_below_axis        # нулі -> інтеграл (від'ємний) -> площа = |I|
    # --- фізика (формула в умові) ---
    - th_physics_path           # шлях = ∫ v(t) dt
  max_attempts: 3
  max_reissues: 2
  # Поріг виходів із тесту (перемикання вкладки АБО перехід в інше вікно).
  # Після 3-го спробу анулюється і учень отримує ПОВНІСТЮ новий варіант.
  # Анульована так спроба РАХУЄТЬСЯ проти max_attempts — інакше вихід став би
  # способом «перекинути» невдалу спробу. Тому max_attempts тут 3, а не 2.
  restart_after_violations: 3
