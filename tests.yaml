# Тема (шкільна математика, заняття 5): степенева функція та корінь n-го степеня.
# 12 різних типів (без перетворень графіків — цього ще не вивчали). Винесення
# множника дає вираз, тож задіяні клавіатура з коренем і живий прев'ю.
- key: theme2
  title: "Степенева функція. Корінь n-го степеня та його властивості"
  question_count: 12
  points_per_question: 1
  # Банк за підручником Мерзляка (10 клас), типові вправи §2-§5:
  #   §2 натуральний показник (2.1-2.2, 2.3-2.4, 2.7-2.8, 2.9)
  #   §3 цілий показник (2.12, 3.3-3.4)
  #   §4 означення кореня (4.1, 4.4, 4.8-4.9)
  #   §5 властивості кореня (5.7-5.8, 5.9-5.10, 5.21-5.22)
  # Плюс дві задачі з графіками. §6 (раціональний показник) НЕ входить — це
  # наступна тема. Попередні набори шаблонів лишаються в коді (полегшений
  # варіант і розбір уже зданих спроб).
  bank:
    # --- §2. степенева функція з натуральним показником ---
    - mz_find_exponent        # за точкою графіка знайти n, тоді f(-a)
    - mz_compare_power        # порівняння значень x^19/x^30 (монотонність+парність)
    - mz_minmax_power         # найбільше й найменше значення на проміжку
    # --- §3. степенева функція із цілим показником ---
    - mz_int_power_expr       # 2^(-1) - 6^(-2) = 17/36 (дробом)
    - mz_compare_int_power    # порівняння значень x^(-n): функція спадає
    # --- §4. означення кореня n-го степеня ---
    - mz_root_sense           # чи має зміст запис + обчислити 3√(-27)
    - mz_solve_power_eq       # (x-c)^(2k) = a — два корені
    # --- §5. властивості кореня ---
    - mz_factor_out           # винесення множника з-під кореня
    - mz_bring_under          # внесення множника під корінь (обернена дія)
    - mz_simplify_sign        # 4√(16x⁴) при x<0 -> -2x (модуль зі знаком)
    # --- графіки ---
    - mz_graph_roots_count    # РИСУНОК: графічно кількість коренів x²=kx+b
    - mz_graph_int_power      # РИСУНОК: y=x^(-n), розрив у нулі + значення
  max_attempts: 2
  max_reissues: 2

- key: integral1
  title: "Первісна та невизначений інтеграл (11 клас)"
  question_count: 12
  points_per_question: 1
  bank:
    # --- степенева / многочлени ---
    - antideriv_poly_point       # первісна квадратного тричлена через точку
    - antideriv_expand           # спершу розкрити дужки, тоді первісна
    - antideriv_cubic_value      # первісна кубічної через точку -> F(x1) (число)
    # --- таблиця первісних (дробові) ---
    - antideriv_reciprocal_sq    # 1/x² -> −1/x
    - antideriv_sqrt             # 1/√x -> 2√x
    # --- правило для f(kx+b) ---
    - antideriv_linear_power     # (kx+b)ⁿ
    - antideriv_trig_linear      # a·sin(kx) / a·cos(kx)
    - antideriv_exp_linear       # a·e^{kx}
    - antideriv_trig_table       # 1/cos²x -> tg x ; 1/sin²x -> −ctg x
    # --- зв'язок F'=f, стала C, фізичний зміст ---
    - antideriv_find_f           # за первісною F знайти f = F'
    - antideriv_find_constant    # знайти сталу C за точкою (число)
    - antideriv_kinematics       # v(t) -> закон руху s(t)
  max_attempts: 2
  max_reissues: 2

# Тест 2 (11 клас): визначений інтеграл і його застосування до обчислення площ.
# 12 різних типів (усі 12 беруться). Чотири задачі на площу — з рисунком
# (заштрихована фігура). Покриття: Ньютон–Лейбніц (многочлен, тригонометрія,
# 1/√x, 1/x², за даною первісною), властивості (лінійність), обернена задача
# (знайти межу), площі (криволінійна трапеція; парабола й вісь; парабола й пряма;
# фігура під віссю = |інтеграл|), фізика (шлях = інтеграл швидкості).
- key: integral2
  title: "Визначений інтеграл та обчислення площ фігур (11 клас)"
  question_count: 12
  points_per_question: 1
  bank:
    # --- формула Ньютона–Лейбніца ---
    - def_nl_poly            # інтеграл многочлена
    - def_nl_trig            # інтеграл sin/cos (межі з π)
    - def_nl_sqrt            # інтеграл a/√x
    - def_nl_reciprocal      # інтеграл k/x²
    - def_nl_from_F          # за первісною F: F(b)-F(a)
    # --- властивості та обернена задача ---
    - def_property_linear    # лінійність: ∫(αf-βg)
    - def_find_limit         # знайти верхню межу b
    # --- площі фігур (з рисунком) ---
    - area_trapezoid         # РИСУНОК: криволінійна трапеція під прямою
    - area_parabola_axis     # РИСУНОК: парабола (вниз) і вісь Ox
    - area_parabola_line     # РИСУНОК: парабола y=x² і пряма
    - area_below_axis        # РИСУНОК: фігура під віссю, S = |інтеграл|
    # --- фізичне застосування ---
    - def_displacement       # шлях = ∫ v(t) dt
  max_attempts: 2
  max_reissues: 2

# ТЕМАТИЧНЕ ОЦІНЮВАННЯ: інтеграл (уся тема) — 12 задач по 1 балу.
# Відмінність від integral1/integral2: задачі КОМПЛЕКСНІ — перевіряється ШЛЯХ
# розв'язання (2–4 поля на задачу: первісна -> стала -> значення; межі перетину ->
# площа; нулі -> інтеграл -> площа). Часткові бали всередині задачі нормуються
# (3 кроки з 4 = 0.75), а перенесення помилки (carry) звіряє наступні кроки з
# власним результатом студента. Три задачі на площу — з рисунком.
# Фізичну формулу наведено в умові (тему в класі ще не давали).
- key: integral_thematic
  title: "Тематичне оцінювання: інтеграл (первісна, невизначений і визначений)"
  question_count: 12
  points_per_question: 1
  bank:
    # --- первісна та невизначений інтеграл ---
    - th_antideriv_poly_point   # F0 -> стала C -> F(x1)
    - th_antideriv_table_sum    # сума двох табличних (a/√x + b/x²) -> C
    - th_antideriv_rules        # правило f(kx+b): sin/e^ або cos/1cos²x -> C
    - th_antideriv_inverse      # означення навпаки: за F знайти f -> f(x0)
    # --- визначений інтеграл ---
    - th_definite_nl            # Ньютон–Лейбніц: F0 -> F0(n) -> інтеграл
    - th_definite_trig          # тригонометричний з межами через π
    - th_definite_properties    # адитивність + лінійність (без обчислень)
    - th_definite_find_limit    # обернена: знайти межу b (квадратне рівняння)
    # --- площі (РИСУНОК) ---
    - th_area_trapezoid         # криволінійна трапеція (геометричний зміст)
    - th_area_between           # перетини як межі -> площа між кривими
    - th_area_below_axis        # нулі -> інтеграл (від'ємний) -> площа = |I|
    # --- фізика (формула в умові) ---
    - th_physics_path           # шлях = ∫ v(t) dt
  max_attempts: 3
  max_reissues: 2
  # ВИМКНЕНО (було 3). Причина: через перебої зі світлом і зв'язком вкладка
  # ховається не з вини учня — реальні студенти втратили всі спроби, жодного разу
  # не дійшовши до кінця. Вихід із тесту й далі перевидає ПИТАННЯ з новими
  # числами (це лишається), але спробу цілком більше не анулює.
  restart_after_violations: null

# Лекція 5: Функція. Границя функції. Неперервність.
# 12 задач по 1 балу, КОМПЛЕКСНІ (2–3 поля: перевіряється шлях розв'язання).
# Покриття: функція (D, парність+період, складена, обернена); границі (∞/∞, 0/0,
# ∞−∞ зі сполученим виразом, перша і друга важливі); неперервність (односторонні
# границі та стрибок, види розривів, розрив за ГРАФІКОМ).
# Відповіді з π вводяться як pi, з e — як e^k.
- key: lecture5
  title: "Лекція 5. Функція. Границя функції. Неперервність"
  question_count: 12
  points_per_question: 1
  bank:
    # --- функція ---
    - lim_domain                # область визначення: межа + виключена точка
    - lim_classify              # парність (f(-x)) + найменший період
    - lim_composite             # складена функція f(φ(x)) + значення
    - lim_inverse               # обернена функція + значення
    # --- обчислення границь ---
    - lim_rational_infty        # ∞/∞: порівняння степенів (дві границі)
    - lim_zero_over_zero        # 0/0: спільний корінь -> скоротити множник
    - lim_conjugate             # ∞−∞: сполучений вираз
    - lim_first_important       # перша важлива: sin(ax)/x та sin(ax)/tg(bx)
    - lim_second_important      # друга важлива: (1+a/x)^x та ^(bx) -> e^k
    # --- неперервність ---
    - lim_piecewise_jump        # односторонні границі кусочної + стрибок
    - lim_discontinuity_types   # усувний vs II роду + границя в усувній точці
    - lim_graph_continuity      # РИСУНОК: розрив на графіку
  max_attempts: 2
  max_reissues: 2

# Лекція 6: Похідна. Таблиця похідних і ТЕХНІКИ диференціювання.
# 12 задач по 1 балу, усі багатокрокові (2–3 поля: перевіряється шлях).
# Обсяг за домовленістю з викладачем: застосувань похідної НЕМА (ще не вивчали),
# значення похідної в точці НЕ шукаємо — лише сама техніка. Тангенс — tg.
# Кожна відповідь — ВИРАЗ із власними коефіцієнтами студента, тож переписати
# в сусіда нічого: одним числом такий результат не передається.
- key: lecture6
  title: "Лекція 6. Похідна. Правила диференціювання"
  question_count: 12
  points_per_question: 1
  bank:
    # --- таблиця похідних ---
    - dv_power_root             # степенева + корінь + 1/x
    - dv_trig_table             # sin, cos, tg
    - dv_exp_log                # e^x, ln x, a^x = a^x·ln a
    # --- правила ---
    - dv_product                # (uv)' = u'v + uv' (u', v', потім y')
    - dv_quotient               # (u/v)' — окремо чисельник, потім вся похідна
    - dv_chain_power            # складена: зовнішня степенева
    - dv_product_chain          # добуток РАЗОМ із ланцюговим правилом
    - dv_chain_exp              # складена: зовнішня e^u
    - dv_chain_sqrt             # складена: зовнішня корінь
    - dv_chain_ln               # складена: зовнішня ln u
    # --- друга похідна ---
    - dv_second_poly            # y'' многочлена
    - dv_second_trig            # y'' тригонометричної (множник k двічі)
  max_attempts: 2
  max_reissues: 2
  # Перезапуск спроби НЕ вмикаємо: перебої зі світлом і зв'язком ховають вкладку
  # не з вини учня (див. integral_thematic). Вихід із тесту перевидає ПИТАННЯ
  # з новими числами — цього достатньо.
  restart_after_violations: null
